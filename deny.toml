# Checked by `cargo xtask verify`. Plan section 16 lists two unmaintained-crate
# notices (ttf-parser, atomic-polyfill) to record as explicit exceptions under
# [advisories] ignore when those dependencies are first added. ttf-parser is
# recorded below; atomic-polyfill comes with postcard, which isn't used yet.

[graph]
# The game's build targets. Dependencies that exist only on other platforms are ignored.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2
ignore = [
    # Plan section 16: reached only through winit's Linux window decorations
    # (sctk-adwaita -> ab_glyph), and the game loads only fonts it ships.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; only winit's Linux decorations use it" },
]

[licenses]
version = 2
# Workspace crates are `publish = false` and carry no licence.
private = { ignore = true }
# The list is ahead of the dependency tree for now.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
