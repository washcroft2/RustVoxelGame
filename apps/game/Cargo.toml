[package]
name = "voxel-game"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossbeam-channel = "=0.5.17"
egui = { version = "=0.37.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
voxel-content = { path = "../../crates/content", version = "0.0.0" }
voxel-core = { path = "../../crates/core", version = "0.0.0" }
voxel-mesh = { path = "../../crates/mesh", version = "0.0.0" }
voxel-render = { path = "../../crates/render", version = "0.0.0" }
voxel-world = { path = "../../crates/world", version = "0.0.0" }
voxel-worldgen = { path = "../../crates/worldgen", version = "0.0.0" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true
