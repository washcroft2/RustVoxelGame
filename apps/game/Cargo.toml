[package]
name = "voxel-game"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Profiling build: Tracy spans and frame marks. Tracy can accept network connections, so this is
# for development machines only and never goes into a family release.
profile = ["voxel-core/profile", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy"]

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
crossbeam-channel = "=0.5.17"
egui = { version = "=0.37.0", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
voxel-content = { path = "../../crates/content", version = "0.0.0" }
voxel-core = { path = "../../crates/core", version = "0.0.0" }
voxel-mesh = { path = "../../crates/mesh", version = "0.0.0" }
voxel-render = { path = "../../crates/render", version = "0.0.0" }
voxel-world = { path = "../../crates/world", version = "0.0.0" }
voxel-worldgen = { path = "../../crates/worldgen", version = "0.0.0" }
tracing = { version = "=0.1.44", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", optional = true, default-features = false, features = ["registry", "std"] }
# Collect only while a profiler is connected, and only accept local connections. Left off on
# purpose: LAN broadcast, system tracing, sampling, code transfer and crash handling.
tracing-tracy = { version = "=0.12.0", optional = true, default-features = false, features = ["enable", "ondemand", "only-localhost"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }

[lints]
workspace = true
