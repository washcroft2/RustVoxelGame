[package]
name = "voxel-render"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }
glam = "=0.34.2"
offset-allocator = "=0.2.0"
pollster = "=1.0.1"
thiserror = "=2.0.21"
voxel-content = { path = "../content", version = "0.0.0" }
voxel-core = { path = "../core", version = "0.0.0" }
voxel-mesh = { path = "../mesh", version = "0.0.0" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }

[dev-dependencies]
voxel-world = { path = "../world", version = "0.0.0" }
voxel-worldgen = { path = "../worldgen", version = "0.0.0" }

[lints]
workspace = true
