# Source, author and licence of every file under textures/ (plan section 11).
# `cargo xtask verify` will fail on a missing entry once that check exists.

[[texture]]
files = ["textures/*.png"]
source = "generated by the project: flat 16x16 colour squares"
author = "project"
licence = "CC0-1.0"
note = "Placeholders for Phase 1 development. Real art is chosen by a person later."

[[font]]
files = ["fonts/monogram-extended.ttf"]
source = "monogram (extended), version 1.1.0; vendor page https://menez.io/ (from the font's own metadata); supplied by the project owner"
author = "Vinicius Menezio"
licence = "CC0-1.0"
note = "Pixel font for the debug overlay. The licence is stated in the font file's own name table."
