[package]
name = "spike-quinn"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Throwaway Phase 0 spike (plan section 13). Delete or promote at the gate.
[dependencies]
anyhow = "=1.0.104"
bytes = "=1.12.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"
